<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Scan en rafale</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="bayen.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&amp;family=Readex+Pro:wght@400;500;600;700&amp;family=Archivo:wdth,wght@62..100,600..900&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="bp phone {{cls}}" style="height: 844px; background: #120C1F">
  <img src="/_blob/4f1aba2b5c7286f041cafb8395c8bb30" alt="" style="position: absolute; left: 50%; top: 210px; width: 300px; transform: translateX(-50%) rotate(-6deg); filter: blur(1.5px) brightness(.85)">
  <div style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, transparent 0 150px, rgb(18 12 31 / .72) 151px)"></div>

  <div style="position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center">
    <a class="icon-btn" href="Main.dc.html" aria-label="Fermer le scanner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <span class="chip" style="background: rgb(255 248 236 / .14); color: #FFF8EC; border-color: rgb(255 248 236 / .4)">Vise le code-barres</span>
    <button class="icon-btn" type="button" aria-label="Allumer la lampe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></button>
  </div>

  <div style="position: absolute; left: 50%; top: 170px; width: 280px; height: 200px; transform: translateX(-50%)">
    <div style="position: absolute; inset: 0; border: 4px solid var(--menthe); border-radius: 28px; clip-path: polygon(0 0, 22% 0, 22% 100%, 78% 100%, 78% 0, 100% 0, 100% 100%, 0 100%); opacity: .95"></div>
    <div style="position: absolute; left: 18px; right: 18px; top: 50%; height: 3px; background: var(--menthe); box-shadow: 0 0 18px var(--menthe); border-radius: 3px"></div>
  </div>
  <p style="position: absolute; top: 392px; width: 100%; text-align: center; color: #FFF8EC; font-size: 13px; opacity: .8">Scan en rafale : enchaîne les produits, on garde la liste.</p>

  <section class="card" style="position: absolute; left: 10px; right: 10px; bottom: 12px; padding: 18px 16px 16px; border-radius: 28px; display: grid; gap: 14px; box-shadow: 0 -4px 0 var(--shadow)">
    <span style="width: 44px; height: 5px; border-radius: 9px; background: var(--muted); opacity: .4; justify-self: center"></span>
    <div style="display: grid; grid-template-columns: 84px 1fr auto; gap: 12px; align-items: center">
      <div class="tile t-pink" style="width: 84px; height: 84px"><img src="/_blob/4f1aba2b5c7286f041cafb8395c8bb30" alt=""></div>
      <div style="min-width: 0">
        <p class="eyebrow">Trouvé en 0,8 s</p>
        <p class="disp d-s" style="margin-top: 3px">Yaourt à boire, fraise</p>
        <p class="muted" style="font-size: 12.5px">Laiterie · 200 g</p>
      </div>
      <div class="sticker sc" role="img" aria-label="Score 52, moyen"><div><b>52</b><span>Moyen</span></div></div>
    </div>
    <div class="chips">
      <span class="chip fill" style="background: #FFC9BC"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5L12 12l8-4.5M12 12v9"/></svg> 22 g de sucres par bouteille</span>
      <span class="chip fill" style="background: #FFE1C4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7 15h10"/></svg> E129 · risque modéré</span>
      <span class="chip fill" style="background: #BFF0DC"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg> Halal</span>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
      <a class="btn" href="Scan.dc.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 9v6M11 9v6M14 9v6M17 9v6"/></svg> Suivant</a>
      <a class="btn primary" href="FichePop.dc.html">Voir la fiche <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
    <a href="FichePop.dc.html" style="display: flex; align-items: center; gap: 10px; font-size: 13.5px; text-decoration: none; padding: 10px 12px; border-radius: 14px; background: var(--soft)">
      <span class="sticker sm sb" style="width: 38px; height: 38px"><div><b>78</b></div></span>
      <span><b>Mieux :</b> Skyr nature 0 %, 4 fois moins de sucre</span>
    </a>
  </section>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme": {"editor": "enum", "options": ["light", "dark"], "default": "light"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    return { cls: theme === 'dark' ? 'dark' : ''  };
  }
}
</script>
</body>
</html>
